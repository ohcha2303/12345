<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0f0f13"/>
<title>บัญชีรายรับ-รายจ่าย AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sarabun',sans-serif;background:#0f0f13;color:#e8e6f0;min-height:100vh;overscroll-behavior:none;padding-bottom:100px}

/* UI Elements */
.card{background:#17171f;border:1px solid #2a2a38;border-radius:16px;padding:20px;margin-bottom:16px}
.inp{background:#0f0f13;border:1.5px solid #2a2a38;border-radius:10px;color:#e8e6f0;font-family:inherit;font-size:16px;padding:12px;width:100%;outline:none;transition:0.2s}
.inp:focus{border-color:#7c6aff}

.btn-primary{background:linear-gradient(135deg,#7c6aff,#a855f7);border:none;border-radius:12px;color:#fff;cursor:pointer;padding:14px;width:100%;font-weight:600;transition:0.2s}
.btn-primary:active{transform:scale(0.98)}

/* Navigation */
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:#13131b;border-top:1px solid #2a2a38;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px 0;background:none;border:none;color:#4a4a6a;font-size:11px;cursor:pointer}
.nav-item.active{color:#7c6aff}
.nav-icon{font-size:22px;margin-bottom:4px}

/* Features */
.txn-row{display:flex;align-items:center;gap:12px;padding:14px;background:#1a1a24;border:1px solid #242432;border-radius:12px;margin-bottom:8px}
.icon-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.slip-preview{width:100%;border-radius:12px;max-height:220px;object-fit:contain;background:#0a0a10;margin-top:10px}
.spinner{width:28px;height:28px;border:3px solid #2a2a3a;border-top-color:#7c6aff;border-radius:50%;animation:spin .8s linear infinite;margin:15px auto}
@keyframes spin{to{transform:rotate(360deg)}}

#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#17171f;border:1px solid #3a2a6a;border-radius:12px;padding:10px 20px;color:#a78bfa;transition:0.3s;z-index:999;font-size:14px}
#toast.show{transform:translateX(-50%) translateY(0)}

.type-btn{flex:1;padding:12px;border-radius:10px;border:1.5px solid #2a2a38;background:#1a1a24;color:#5a5a7a;font-weight:600;cursor:pointer}
.type-btn.active.inc{background:#0d2e1a;border-color:#22c55e;color:#22c55e}
.type-btn.active.exp{background:#2a1020;border-color:#f43f5e;color:#f43f5e}
</style>
</head>
<body>

<div id="toast"></div>
<div id="app" style="max-width:430px;margin:0 auto;padding:20px"></div>

<nav class="nav-bar">
  <button class="nav-item active" onclick="setTab('overview')"><span class="nav-icon">📊</span>สรุป</button>
  <button class="nav-item" onclick="setTab('history')"><span class="nav-icon">📋</span>รายการ</button>
  <button class="nav-item" onclick="setTab('slip')"><span class="nav-icon">📸</span>สแกนสลิป</button>
  <button class="nav-item" onclick="setTab('add')"><span class="nav-icon">➕</span>เพิ่ม</button>
</nav>

<script>
const SK="expense_txns_v2";
const KEY_NAME="gemini_api_key";
const today=new Date().toISOString().split("T")[0];

let txns=JSON.parse(localStorage.getItem(SK))||[];
let activeTab="overview";
let slipState={status:"idle",img:"",result:null};
let form={type:"expense",amount:"",note:"",date:today};

function showToast(m){const t=document.getElementById("toast");t.innerText=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
function save(){localStorage.setItem(SK,JSON.stringify(txns))}
function setTab(t){activeTab=t;render()}

// --- AI Logic ---
async function analyzeSlip(file){
  const key=localStorage.getItem(KEY_NAME);
  if(!key){
    const inputKey=prompt("🔑 กรุณาใส่ Gemini API Key (ฟรีจาก aistudio.google.com):");
    if(inputKey){localStorage.setItem(KEY_NAME,inputKey.trim()); location.reload();}
    return;
  }

  slipState={status:"loading",img:URL.createObjectURL(file),result:null}; render();

  const reader=new FileReader();
  reader.readAsDataURL(file);
  reader.onload=async()=>{
    try{
      const base64=reader.result.split(",")[1];
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[
          {inline_data:{mime_type:file.type,data:base64}},
          {text:"สกัดข้อมูลสลิปโอนเงินไทย ตอบเป็น JSON เท่านั้น: {amount:number, date:YYYY-MM-DD, note:string, bank:string}"}
        ]}]})
      });
      const data=await res.json();
      if(data.error) throw new Error(data.error.message);
      
      const text=data.candidates[0].content.parts[0].text.replace(/```json|```/g,"").trim();
      const result=JSON.parse(text);
      
      slipState={status:"done",img:reader.result,result};
      form={...form, amount:String(result.amount), note:result.note || result.bank, date:result.date||today};
    }catch(e){
      alert("สแกนไม่สำเร็จ: " + e.message);
      slipState={status:"idle",img:""};
    }
    render();
  };
}

function addTxn(){
  if(!form.amount) return showToast("⚠️ กรุณากรอกเงิน");
  txns.push({...form, id:Date.now(), amount:Number(form.amount)});
  save(); showToast("✅ บันทึกเรียบร้อย");
  setTab('history');
  form={type:"expense",amount:"",note:"",date:today};
}

function deleteTxn(id){
    txns=txns.filter(t=>t.id!==id);
    save(); render();
}

function render(){
  const app=document.getElementById("app");
  document.querySelectorAll('.nav-item').forEach((el,i)=>el.classList.toggle('active', ['overview','history','slip','add'][i]===activeTab));

  if(activeTab==="overview"){
    const totalExp=txns.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
    const totalInc=txns.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
    const bal=totalInc-totalExp;
    app.innerHTML=`
      <div style="margin-bottom:20px">
        <div style="font-size:12px;color:#6b6b8a;letter-spacing:1px">ยอดคงเหลือรวม</div>
        <div style="font-size:36px;font-weight:700;color:${bal>=0?'#a78bfa':'#f87171'}">฿${bal.toLocaleString(undefined,{minimumFractionDigits:2})}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
        <div class="card" style="margin:0"><small style="color:#6b6b8a">รายรับ</small><br><b style="color:#22c55e;font-size:18px">+฿${totalInc.toLocaleString()}</b></div>
        <div class="card" style="margin:0"><small style="color:#6b6b8a">รายจ่าย</small><br><b style="color:#f43f5e;font-size:18px">-฿${totalExp.toLocaleString()}</b></div>
      </div>
      <div class="card">
        <div style="font-size:14px;font-weight:600;margin-bottom:10px">ประวัติล่าสุด</div>
        ${txns.slice(-3).reverse().map(t=>`<div style="font-size:13px;display:flex;justify-content:space-between;margin-bottom:5px"><span>${t.note||'ทั่วไป'}</span><span style="color:${t.type==='inc'?'#22c55e':'#f43f5e'}">${t.amount}</span></div>`).join('')}
      </div>
    `;
  }

  else if(activeTab==="history"){
    app.innerHTML=`<h3 style="margin-bottom:15px">รายการทั้งหมด</h3>` + 
    ([...txns].reverse().map(t=>`
      <div class="txn-row">
        <div class="icon-circle" style="background:${t.type==='income'?'#0d2e1a':'#2a1020'}">${t.type==='income'?'💰':'💸'}</div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${t.note||'บันทึกทั่วไป'}</div>
          <div style="font-size:12px;color:#5a5a7a">${t.date}</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:700;color:${t.type==='income'?'#22c55e':'#f43f5e'}">${t.type==='income'?'+':'-'}฿${t.amount.toLocaleString()}</div>
          <button onclick="deleteTxn(${t.id})" style="background:none;border:none;color:#444;font-size:10px">ลบ</button>
        </div>
      </div>
    `).join("") || `<div style="text-align:center;padding:40px;color:#4a4a6a">ไม่มีรายการ</div>`);
  }

  else if(activeTab==="slip"){
    app.innerHTML=`
      <div class="card" style="text-align:center">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <span style="font-weight:bold">สแกนสลิปด้วย AI</span>
            <button onclick="localStorage.removeItem('${KEY_NAME}');location.reload()" style="background:#1a1a24;border:1px solid #333;color:#666;padding:4px 8px;border-radius:6px;font-size:10px">เปลี่ยน Key</button>
        </div>
        ${slipState.status==='loading'?'<div class="spinner"></div><p style="font-size:13px;color:#a78bfa">AI กำลังอ่านข้อมูล...</p>':''}
        ${slipState.img?`<img src="${slipState.img}" class="slip-preview">`:
        `<div style="padding:40px 20px;border:2px dashed #2a2a38;border-radius:12px;color:#4a4a6a">
            <div style="font-size:40px;margin-bottom:10px">📸</div>
            <p style="font-size:13px">เลือกรูปสลิปโอนเงิน<br>AI จะกรอกข้อมูลให้เอง</p>
        </div>`}
        
        <input type="file" accept="image/*" onchange="analyzeSlip(this.files[0])" id="file" style="display:none">
        <button class="btn-primary" onclick="document.getElementById('file').click()" style="margin-top:20px">เลือกรูปภาพ</button>
        
        ${slipState.status==='done'?`
          <div style="margin-top:15px;padding:15px;background:#0d1a10;border-radius:10px;text-align:left;border:1px solid #22c55e33">
            <div style="color:#22c55e;font-size:12px;font-weight:bold;margin-bottom:5px">AI อ่านได้:</div>
            <div style="font-size:14px">ยอดเงิน: ฿${slipState.result.amount}</div>
            <div style="font-size:14px">บันทึก: ${slipState.result.note || slipState.result.bank}</div>
          </div>
          <button class="btn-primary" onclick="setTab('add')" style="background:#22c55e;margin-top:10px">✅ ตรวจสอบและบันทึก</button>
        `:''}
      </div>
    `;
  }

  else if(activeTab==="add"){
    app.innerHTML=`
      <div class="card">
        <h3 style="margin-bottom:20px">เพิ่มรายการ</h3>
        <div style="display:flex;gap:10px;margin-bottom:20px">
          <button class="type-btn ${form.type==='expense'?'active exp':''}" onclick="form.type='expense';render()">💸 รายจ่าย</button>
          <button class="type-btn ${form.type==='income'?'active inc':''}" onclick="form.type='income';render()">💰 รายรับ</button>
        </div>
        <div style="margin-bottom:15px">
            <label style="font-size:12px;color:#6b6b8a">จำนวนเงิน (บาท)</label>
            <input class="inp" type="number" inputmode="decimal" placeholder="0.00" value="${form.amount}" oninput="form.amount=this.value">
        </div>
        <div style="margin-bottom:15px">
            <label style="font-size:12px;color:#6b6b8a">หมายเหตุ / รายละเอียด</label>
            <input class="inp" type="text" placeholder="ซื้ออะไรไป..." value="${form.note}" oninput="form.note=this.value">
        </div>
        <div style="margin-bottom:20px">
            <label style="font-size:12px;color:#6b6b8a">วันที่</label>
            <input class="inp" type="date" value="${form.date}" onchange="form.date=this.value">
        </div>
        <button class="btn-primary" onclick="addTxn()">บันทึกรายการ</button>
      </div>
    `;
  }
}

render();
</script>
</body>
</html>
