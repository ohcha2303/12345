<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0f0f13"/>
<title>บัญชีรายรับ-รายจ่าย AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sarabun',sans-serif;background:#0f0f13;color:#e8e6f0;min-height:100vh;overscroll-behavior:none;padding-bottom:90px}
.card{background:#17171f;border:1px solid #2a2a38;border-radius:16px;padding:20px}
.inp{background:#0f0f13;border:1.5px solid #2a2a38;border-radius:10px;color:#e8e6f0;font-family:inherit;font-size:16px;padding:12px;width:100%;outline:none}
.inp:focus{border-color:#7c6aff}
.btn-primary{background:linear-gradient(135deg,#7c6aff,#a855f7);border:none;border-radius:12px;color:#fff;cursor:pointer;padding:14px;width:100%;font-weight:600}
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:#13131b;border-top:1px solid #2a2a38;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px 0;background:none;border:none;color:#4a4a6a;font-size:11px}
.nav-item.active{color:#7c6aff}
.nav-icon{font-size:20px}
.slip-preview{width:100%;border-radius:12px;max-height:250px;object-fit:contain;background:#000}
.spinner{width:30px;height:30px;border:3px solid #2a2a3a;border-top-color:#7c6aff;border-radius:50%;animation:spin .8s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#17171f;border:1px solid #3a2a6a;border-radius:12px;padding:10px 20px;color:#a78bfa;transition:0.3s;z-index:999}
#toast.show{transform:translateX(-50%) translateY(0)}
.cat-pill{background:#1e1e2a;border:1px solid #2a2a38;border-radius:20px;padding:8px 12px;margin:2px;cursor:pointer;font-size:13px}
.cat-pill.active{background:#7c6aff;color:#fff}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app" style="max-width:430px;margin:0 auto;padding:20px"></div>

<nav class="nav-bar">
  <button class="nav-item active" onclick="setTab('overview')"><span class="nav-icon">📊</span>สรุป</button>
  <button class="nav-item" onclick="setTab('history')"><span class="nav-icon">📋</span>รายการ</button>
  <button class="nav-item" onclick="setTab('slip')"><span class="nav-icon">📸</span>สแกนสลิป</button>
  <button class="nav-item" onclick="setTab('add')"><span class="nav-icon">➕</span>เพิ่ม</button>
</nav>

<script>
const SK="expense_txns_v2";
const KEY_NAME="gemini_api_key";
const today=new Date().toISOString().split("T")[0];
let txns=JSON.parse(localStorage.getItem(SK))||[];
let activeTab="overview";
let slipState={status:"idle",img:"",result:null};
let form={type:"expense",category:"food",amount:"",note:"",date:today};

function showToast(m){const t=document.getElementById("toast");t.innerText=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}

function save(){localStorage.setItem(SK,JSON.stringify(txns))}

function setTab(t){activeTab=t;render()}

// --- AI Logic ---
async function analyzeSlip(file){
  const key=localStorage.getItem(KEY_NAME);
  if(!key){
    const inputKey=prompt("🔑 กรุณาใส่ Gemini API Key (รับได้ที่ aistudio.google.com)");
    if(inputKey){localStorage.setItem(KEY_NAME,inputKey); location.reload();}
    return;
  }

  slipState={status:"loading",img:URL.createObjectURL(file)}; render();

  const reader=new FileReader();
  reader.readAsDataURL(file);
  reader.onload=async()=>{
    try{
      const base64=reader.result.split(",")[1];
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[
          {inline_data:{mime_type:file.type,data:base64}},
          {text:"สกัดข้อมูลสลิปไทย ตอบเป็น JSON เท่านั้น: {amount:number, date:YYYY-MM-DD, note:string}"}
        ]}]})
      });
      const data=await res.json();
      const text=data.candidates[0].content.parts[0].text.replace(/```json|```/g,"");
      const result=JSON.parse(text);
      slipState={status:"done",img:reader.result,result};
      form={...form, amount:result.amount, note:result.note, date:result.date||today};
    }catch(e){
      alert("Error: "+e.message);
      slipState={status:"idle",img:""};
    }
    render();
  };
}

function addTxn(){
  if(!form.amount) return alert("กรุณากรอกจำนวนเงิน");
  txns.push({...form, id:Date.now(), amount:Number(form.amount)});
  save(); showToast("✅ บันทึกแล้ว");
  setTab('history');
}

function render(){
  const app=document.getElementById("app");
  document.querySelectorAll('.nav-item').forEach((el,i)=>el.classList.toggle('active', ['overview','history','slip','add'][i]===activeTab));

  if(activeTab==="overview"){
    const totalExp=txns.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
    const totalInc=txns.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
    app.innerHTML=`
      <div class="card" style="background:linear-gradient(135deg,#7c6aff,#a855f7);color:#fff">
        <div style="opacity:0.8;font-size:14px">ยอดคงเหลือ</div>
        <div style="font-size:32px;font-weight:bold">฿${(totalInc-totalExp).toLocaleString()}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
        <div class="card">รายรับ<br><b style="color:#22c55e">฿${totalInc.toLocaleString()}</b></div>
        <div class="card">รายจ่าย<br><b style="color:#f43f5e">฿${totalExp.toLocaleString()}</b></div>
      </div>
    `;
  }

  else if(activeTab==="history"){
    app.innerHTML=txns.reverse().map(t=>`
      <div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between">
        <div><b>${t.note||'ไม่มีชื่อ'}</b><br><small>${t.date}</small></div>
        <div style="color:${t.type==='income'?'#22c55e':'#f43f5e'}"><b>${t.type==='income'?'+':'-'}฿${t.amount}</b></div>
      </div>
    `).join("") || "ไม่มีข้อมูล";
  }

  else if(activeTab==="slip"){
    app.innerHTML=`
      <div class="card" style="text-align:center">
        <h3 style="margin-bottom:10px">📸 สแกนสลิปด้วย AI</h3>
        ${slipState.status==='loading'?'<div class="spinner"></div>':''}
        ${slipState.img?`<img src="${slipState.img}" class="slip-preview">`:''}
        <input type="file" accept="image/*" onchange="analyzeSlip(this.files[0])" id="file" style="display:none">
        <button class="btn-primary" onclick="document.getElementById('file').click()" style="margin-top:15px">เลือกรูปสลิป</button>
        ${slipState.status==='done'?`<button class="btn-primary" onclick="setTab('add')" style="background:#22c55e;margin-top:10px">✅ ข้อมูลถูกต้อง ไปบันทึก</button>`:''}
        <button onclick="localStorage.removeItem('${KEY_NAME}');location.reload()" style="background:none;border:none;color:#4a4a6a;font-size:10px;margin-top:20px">ล้าง API Key</button>
      </div>
    `;
  }

  else if(activeTab==="add"){
    app.innerHTML=`
      <div class="card">
        <h3 style="margin-bottom:15px">เพิ่มรายการ</h3>
        <div style="display:flex;gap:5px;margin-bottom:15px">
          <button class="btn-primary" style="background:${form.type==='expense'?'#f43f5e':'#1e1e2a'}" onclick="form.type='expense';render()">รายจ่าย</button>
          <button class="btn-primary" style="background:${form.type==='income'?'#22c55e':'#1e1e2a'}" onclick="form.type='income';render()">รายรับ</button>
        </div>
        <input class="inp" type="number" placeholder="จำนวนเงิน" value="${form.amount}" oninput="form.amount=this.value" style="margin-bottom:10px">
        <input class="inp" type="text" placeholder="หมายเหตุ" value="${form.note}" oninput="form.note=this.value" style="margin-bottom:10px">
        <input class="inp" type="date" value="${form.date}" onchange="form.date=this.value" style="margin-bottom:15px">
        <button class="btn-primary" onclick="addTxn()">บันทึกรายการ</button>
      </div>
    `;
  }
}

render();
</script>
</body>
</html>
